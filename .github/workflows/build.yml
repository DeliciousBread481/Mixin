name: Build  
  
on:  
  push:  
    branches: [ 0.8.5-test ]  
  pull_request:  
    branches: [ 0.8.5-test ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
  
      - name: Set up JDK 8  
        uses: actions/setup-java@v4  
        with:  
          java-version: '8'  
          distribution: 'temurin'  
  
      - name: Set up JDK 16  
        uses: actions/setup-java@v4  
        with:  
          java-version: '16'  
          distribution: 'temurin'  
          cache: 'gradle'  
  
      - name: Grant execute permission for gradlew  
        run: chmod +x gradlew  
  
      - name: Build  
        run: >  
          ./gradlew build stagingJar  
          -PciSystem=github  
          -PbuildNumber=${{ github.run_number }}  
          -Pcommit=${{ github.sha }}  
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_16_X64  
          -x license  
  
      - name: Upload build artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: mixin-${{ github.run_number }}-${{ github.sha }}  
          path: build/libs/*.jar  
          retention-days: 30